# Default profile: runs with zero setup on an in-memory H2 database.
# Use the "postgres" profile (application-postgres.yml) for a real database.
server:
  port: 8080

spring:
  application:
    name: docflow-api
  datasource:
    # MODE=PostgreSQL keeps H2 close to production SQL
    url: jdbc:h2:mem:docflow;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false            # no lazy loading from controllers: mapping happens inside transactions
    hibernate:
      ddl-auto: none               # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          batch_size: 200
        order_inserts: true
        order_updates: true
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB
  mvc:
    problemdetails:
      enabled: true                # RFC 7807 problem+json error bodies
  data:
    web:
      pageable:
        max-page-size: 200
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html

docflow:
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  storage:
    type: local                    # local = files on disk; database = in PostgreSQL (cloud profile)
    root: ./data/uploads
  admin:
    # Secret for DELETE /api/v1/admin/documents/{id}. Empty (default) = admin endpoints off.
    # Set it only as an environment variable (cf set-env), never in Git. At least 16 characters.
    token: ${DOCFLOW_ADMIN_TOKEN:}
  limits:
    uploads-per-ip-per-hour: 0     # 0 = unlimited; the cloud profile sets limits for the public demo
    uploads-per-day: 0
  demo-data:
    enabled: true                  # seeds realistic sample documents on first start
    days: 14
  pipeline:
    review-threshold: 0.85         # a field below this confidence sends the document to human review
    po-number-pattern: "PO-\\d{9}" # this company's purchase-order format
  llm:
    # offline    = built-in rule-based extractor, no API key, no cost (default, used by tests)
    # anthropic  = Claude via the Messages API
    # openai     = any OpenAI-compatible Chat Completions API (OpenAI, Mistral, Groq, local Ollama ...)
    provider: ${DOCFLOW_LLM_PROVIDER:offline}
    api-key: ${DOCFLOW_LLM_API_KEY:}
    model: ${DOCFLOW_LLM_MODEL:}
    base-url: ${DOCFLOW_LLM_BASE_URL:}
    timeout-seconds: 60
    # Prices in EUR per million tokens, from your provider's price list. 0 = cost not tracked.
    input-price-per-million: ${DOCFLOW_LLM_INPUT_PRICE:0}
    output-price-per-million: ${DOCFLOW_LLM_OUTPUT_PRICE:0}
